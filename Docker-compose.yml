services:
  db:
    image: postgres:15
    container_name: lms_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lms_redis
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: lms_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: lms_celery
    command: celery -A config worker --loglevel=info --pool=gevent
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - backend

  celery-beat:
    build: .
    container_name: lms_celery_beat
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - backend

volumes:
  postgres_data: